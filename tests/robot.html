<!DOCTYPE html>
<html>
	<head>
		<title>Server Log Insights: Robot Test</title>
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />
		<style>
			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			}

			p {
				font-size: larger;
			}

			.bot__result {
				font-weight: bold;
			}

			.bot__result--human {
				color: green;
			}

			.bot__result--robot {
				color: red;
			}
		</style>
	</head>
	<body>
		<h1>Server Log Insights: Robot Test</h1>
		<p>Your device appears to be <span class="bot__result">Unknown</span></p>
		<table id="table">
			<tr>
				<th>Test</th>
				<th>Result</th>
				<th>Counts</th>
			</tr>
		</table>
		<script type="module">
			import {tests, corroborate} from "../src/robots.js";
			document.addEventListener("DOMContentLoaded", async () => {
				const table = document.getElementById("table"),
					proms = [],
					keys = Object.keys(tests),
					start = performance.now();

				// a check that throws has failed
				keys.forEach(key => {
					try {
						proms.push(tests[key]());
					} catch (e) {
						proms.push(false);
					}
				});
				Promise.all(proms).then(values => {
					const time = performance.now() - start,
						failed = [];

					// list each check, one that could not run does not count either way
					values.forEach((item, i) => {
						const row = document.createElement("tr"),
							test = document.createElement("td"),
							result = document.createElement("td"),
							counts = document.createElement("td"),
							skipped = item === null || item === undefined,
							weak = corroborate.includes(keys[i]);
						if (!skipped && !item) {
							failed.push(keys[i]);
						}
						test.innerText = keys[i];
						result.innerText = skipped ? "Unavailable" : (item ? "Pass" : "Fail");
						counts.innerText = skipped || item ? "" : (weak ? "Needs corroborating" : "Conclusive");
						row.appendChild(test);
						row.appendChild(result);
						row.appendChild(counts);
						table.appendChild(row);
					});

					// a conclusive check convicts by itself, the circumstantial ones only once they agree with each other
					const target = document.getElementsByClassName("bot__result")[0],
						isrobot = failed.some(key => !corroborate.includes(key)) || failed.length > 1,
						summary = document.createElement("p");
					target.textContent = isrobot ? "a Robot" : "Human";
					target.classList.add("bot__result--" + (isrobot ? "robot" : "human"));
					summary.innerText = failed.length + " of " + keys.length + " checks failed, completed in " + (time / 1000) + "s";
					table.after(summary);
				});
			});
		</script>
	</body>
</html>
